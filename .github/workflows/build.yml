name: Build iOS App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies & Build
        run: |
          npm install
          npm run build

      - name: Sync Capacitor iOS
        run: |
          npx cap sync ios

      - name: Fix Podfile Target Version
        run: |
          cd ios/App
          sed -i '' "s/platform :ios, .*/platform :ios, '18.0'/g" Podfile
          pod install
          cd ../..

      - name: Build Archive
        run: |
          cd ios/App
          xcodebuild -scheme App -sdk iphonesimulator -configuration Debug -destination 'platform=iOS Simulator,name=iPhone 18' build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: ios/App/build/Build/Products/Debug-iphonesimulator/App.app
