name: Build iOS App (xcarchive only)

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies & Build Web Assets
        run: |
          npm ci
          npm run build

      - name: Sync Capacitor iOS
        run: |
          npx cap sync ios

      - name: Fix Podfile Target Version
        run: |
          cd ios/App
          sed -i '' "s/platform :ios, .*/platform :ios, '18.0'/g" Podfile || true
          pod install --repo-update || true
          cd ../..

      - name: Build archive (xcarchive)
        run: |
          set -o pipefail
          cd ios/App
          mkdir -p build
          if [ -f App.xcworkspace ]; then
            xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -archivePath ./build/App.xcarchive archive | xcpretty || true
          else
            xcodebuild -scheme App -configuration Release -archivePath ./build/App.xcarchive archive | xcpretty || true
          fi
          cd ../..

      - name: Upload xcarchive
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcarchive
          path: ios/App/build/App.xcarchive
